# Declarative Automation Bundle (formerly Databricks Asset Bundle)
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run      -t dev bronze_silver_job
#
# All three targets use one Azure Databricks workspace and one catalog; each
# target writes to its own schemas:
#   dev  -> dev_bronze  / dev_silver    deployed from your laptop, runs as you
#   test -> test_bronze / test_silver   deployed by GitHub Actions on pull requests
#   prod -> bronze      / silver        deployed by GitHub Actions after merge + approval
# GitHub Actions signs in as the service principal (secrets DATABRICKS_CLIENT_ID /
# DATABRICKS_CLIENT_SECRET), so test and prod run as that service principal.

bundle:
  name: bronze_silver

include:
  - resources/*.yml

workspace:
  host: https://adb-7405612659094971.11.azuredatabricks.net

variables:
  catalog:
    description: Unity Catalog catalog for all targets (check the name in Catalog Explorer)
    default: <your-catalog>
  bronze_schema:
    description: Schema for bronze tables (must already exist)
  silver_schema:
    description: Schema for silver tables (must already exist)
  source_root:
    description: Landing folder; empty = /Volumes/<catalog>/<bronze_schema>/landing/incoming
    default: ""
  archive_root:
    description: Archive folder; empty = /Volumes/<catalog>/<bronze_schema>/landing/archive
    default: ""
  clean_source:
    description: OFF = leave files in landing; MOVE = move processed files to the archive
    default: "OFF"
  archive_after:
    description: How long after loading a file is moved (MOVE only)
    default: "30 days"

targets:
  dev:
    mode: development       # names prefixed with [dev <you>], schedule paused
    default: true
    variables:
      bronze_schema: dev_bronze
      silver_schema: dev_silver

  test:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[test] "          # tell test and prod apart in the same workspace
      trigger_pause_status: PAUSED    # CI runs it; no daily schedule in test
    variables:
      bronze_schema: test_bronze
      silver_schema: test_silver

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      bronze_schema: bronze
      silver_schema: silver
