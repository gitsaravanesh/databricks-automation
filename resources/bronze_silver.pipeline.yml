# The pipeline: 10 bronze streaming tables + 10 silver tables.
# Paths are relative to this file.

resources:
  pipelines:
    bronze_silver:
      name: bronze_silver
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}          # default schema; the code uses full table names
      serverless: true
      continuous: false                     # triggered: process new data, then stop
      root_path: ../src/bronze_silver       # lets transformations import utilities
      libraries:
        - glob:
            include: ../src/bronze_silver/transformations/**
      configuration:                        # read in code with spark.conf.get(...)
        source_root: ${var.source_root}
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        clean_source: ${var.clean_source}
        archive_root: ${var.archive_root}
        archive_after: ${var.archive_after}
